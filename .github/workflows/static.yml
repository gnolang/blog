# Deploys the blog sources and their assets to GitHub Pages.
#
# This is not a mirror of the blog -- the blog lives on chain at
# gno.land/r/gnoland/blog. It is asset hosting: 42 image references inside
# published posts point at https://gnolang.github.io/blog/<post-dir>/src/...,
# so every path under posts/ must keep resolving exactly as it does today.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Without this the site root returns 404 -- assets underneath serve fine,
      # but there is nothing to land on. Generated here, never committed.
      - name: Generate index
        run: python3 .github/scripts/build-pages-index.py posts
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire posts dir
          name: 'github-pages'
          path: './posts'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
